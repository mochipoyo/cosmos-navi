# 宇宙実測ナビ：地名データ（地球ライブの地名ラベル・地名検索）を作ります。
# - 月に1回（3日 13:41 JST ごろ）と手動実行で動きます。
# - Natural Earth（パブリックドメイン）と GeoNames（CC BY 4.0）を公式の配布元から取得し、scripts/build-geo.mjs で変換します。
# - できたデータは「geo-data」ブランチに置きます（毎回1つのコミットで置き換えるので、リポジトリの容量は増え続けません）。
#   公開用ワークフロー（Update live cameras and deploy site）が、このブランチの内容をサイトの geo/ に入れて公開します。
# - APIキーなどの秘密情報は使いません。
name: Build place names

on:
  schedule:
    - cron: '41 4 3 * *'
  workflow_dispatch:
  push:
    branches: [earth-geo]
    paths: [scripts/build-geo.mjs, .github/workflows/build-geo.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: build-geo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download Natural Earth (10m, GeoJSON)
        run: |
          mkdir -p ne
          base=https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson
          for f in ne_10m_admin_0_countries ne_10m_admin_1_states_provinces ne_10m_populated_places ne_10m_geography_regions_points ne_10m_geography_regions_polys ne_10m_geography_regions_elevation_points ne_10m_geography_marine_polys ne_10m_lakes ne_10m_rivers_lake_centerlines ne_10m_airports ne_10m_ports; do
            curl -fsSL --retry 3 -o "ne/$f.geojson" "$base/$f.geojson"
          done
          ls -la ne

      - name: Download GeoNames (official dump)
        run: |
          mkdir -p gn
          for f in cities1000.zip allCountries.zip alternateNamesV2.zip admin1CodesASCII.txt countryInfo.txt; do
            curl -fsSL --retry 3 --retry-delay 20 -A "cosmos-navi-build/1.0 (+https://github.com/${GITHUB_REPOSITORY})" -o "gn/$f" "https://download.geonames.org/export/dump/$f"
          done
          ls -la gn

      - name: Build
        run: node scripts/build-geo.mjs --ne ne --geonames gn --geonamesDate "$(date -u +%F)" --out out

      - name: Check the result
        run: |
          node -e "const m=require('./out/meta.json');console.log(m.counts);if(m.counts.base<500||m.counts.geonames<100000)throw new Error('件数が少なすぎます（取得の失敗の可能性）')"
          du -sh out

      - name: Publish to the geo-data branch
        run: |
          cd out
          git init -q
          git checkout -q -b geo-data
          git config user.name "github-actions[bot]"
          git config user.email "41898290+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Place-name data $(date -u +%F) (Natural Earth, GeoNames CC BY 4.0)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" geo-data
          echo "geo-data ブランチを更新しました"

      - name: Publish the site
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-livecams.yml --ref main
