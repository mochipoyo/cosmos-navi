# 宇宙実測ナビ：新しいカメラの発見・登録（配信状態の確認とは別のワークフロー）
# - 1日1回（日本時間 12:23 ごろ）と手動実行で動きます。
# - 公開APIの定期更新画像カメラを webcams.json に、YouTube の新しいライブ候補を livecams-candidates.json に書き出します。
# - 保存したあと、公開用のワークフロー（Update live cameras and deploy site）を起動してサイトに反映します。
# - APIキーは Secrets（YT_API_KEY、必要なら TFL_APP_KEY / WINDY_API_KEY）から渡します。ファイルには書きません。
#
# 失敗の扱い：一部の提供元だけの障害は警告（前回のデータを残して成功）。
# 台帳の検証エラー・件数の異常な減少・全提供元の障害・保存失敗・公開の起動失敗は、最後にワークフローを失敗にします。
name: Discover cameras

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write   # webcams.json などをリポジトリに保存するため
  actions: write    # 公開用ワークフローを起動するため

concurrency:
  group: discover-cams
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      CAM_LOG_FILE: cam-discover-log.json   # 更新ログ（2時間ごとの更新とは別のファイルにして、保存時の競合を避ける）
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 60

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Discover cameras from official sources
        id: discover
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
        run: node scripts/discover-cams.mjs webcams.json livecams.json livecams-candidates.json

      - name: Validate data (restore the last good version if broken)
        id: validate
        continue-on-error: true
        run: node scripts/validate-data.mjs .

      - name: Save results to the repository
        id: save
        continue-on-error: true
        run: bash scripts/save-to-repo.sh "Discover cameras [skip ci]" webcams.json livecams-candidates.json cam-discover-log.json

      - name: Publish the site
        id: publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-livecams.yml --ref "${GITHUB_REF_NAME}"

      - name: Report result
        if: always()
        env:
          R_DISCOVER: ${{ steps.discover.outcome }}
          R_VALIDATE: ${{ steps.validate.outcome }}
          R_SAVE: ${{ steps.save.outcome }}
          R_PUBLISH: ${{ steps.publish.outcome }}
        run: |
          echo "発見=$R_DISCOVER / 検証=$R_VALIDATE / 保存=$R_SAVE / 公開の起動=$R_PUBLISH"
          {
            echo "### カメラ発見の結果"
            echo "| 手順 | 結果 |"; echo "|---|---|"
            echo "| 公式提供元からの取得 | $R_DISCOVER |"; echo "| データ検証・ロールバック | $R_VALIDATE |"
            echo "| リポジトリへの保存 | $R_SAVE |"; echo "| 公開ワークフローの起動 | $R_PUBLISH |"
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "$R_DISCOVER" "$R_VALIDATE" "$R_SAVE" "$R_PUBLISH"; do
            if [ "$r" = "failure" ]; then echo "::error::失敗した手順があります（上の表を確認してください）"; exit 1; fi
          done
