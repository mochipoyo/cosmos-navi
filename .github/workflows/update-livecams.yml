# 宇宙実測ナビ：ライブカメラの状態を定期的に確認し、GitHub Pages に公開します。
# - 2時間ごと（毎時17分）・手動実行・main ブランチへのアップロード時に動きます。
# - YouTube の APIキーは リポジトリの Secrets「YT_API_KEY」から渡します（ファイルには書きません）。
# - キーが未設定でもサイトの公開は行います（ライブカメラは前回確認時のデータで表示）。
# - この方式を使うには、Settings → Pages → Build and deployment → Source を「GitHub Actions」にしてください。
#
# 失敗の扱い：
# - 各手順は途中で失敗しても、前回の正常データでサイトの公開まで進めます（サイトが止まらないように）。
# - そのうえで、致命的な失敗（YouTube の確認が全くできない・データの検証エラー・保存失敗・公開失敗）があれば
#   最後の手順でワークフローを「失敗（赤い×）」にして、メールなどで気づけるようにします。
# - 一部の画像提供元だけの障害は「警告」にとどめ、成功（緑）のままにします。
name: Update live cameras and deploy site

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # 更新したデータをリポジトリに保存するため
  pages: write      # GitHub Pages へ公開するため
  id-token: write   # GitHub Pages へ公開するため

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 60   # 前回の正常データに戻すため、最近の履歴も取得

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check YouTube live status
        id: youtube
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/update-livecams.mjs livecams.json

      - name: Check still-image cameras (image fetch and capture time)
        id: stills
        continue-on-error: true
        run: |
          if [ -f webcams.json ]; then node scripts/check-stills.mjs webcams.json webcams-status.json; else echo "webcams.json がないため省略"; fi

      - name: Validate data (restore the last good version if broken)
        id: validate
        continue-on-error: true
        run: node scripts/validate-data.mjs .

      - name: Save updated data to the repository
        id: save
        continue-on-error: true
        run: bash scripts/save-to-repo.sh "Update live camera status [skip ci]" livecams.json webcams.json webcams-status.json cam-update-log.json

      - name: Prepare site files
        run: |
          mkdir -p _site
          for f in index.html livecams.json webcams.json webcams-status.json cam-update-log.json README.md THIRD_PARTY_NOTICES.md favicon.ico favicon.svg apple-touch-icon.png icon-192.png icon-512.png site.webmanifest; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          test -f _site/index.html || { echo "::error::index.html がありません"; exit 1; }
          ls -la _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Report result
        if: always()
        env:
          R_YOUTUBE: ${{ steps.youtube.outcome }}
          R_STILLS: ${{ steps.stills.outcome }}
          R_VALIDATE: ${{ steps.validate.outcome }}
          R_SAVE: ${{ steps.save.outcome }}
          R_DEPLOY: ${{ steps.deployment.outcome }}
        run: |
          echo "YouTube確認=$R_YOUTUBE / 画像確認=$R_STILLS / 検証=$R_VALIDATE / 保存=$R_SAVE / 公開=$R_DEPLOY"
          {
            echo "### ライブカメラ更新の結果"
            echo "| 手順 | 結果 |"; echo "|---|---|"
            echo "| YouTube の配信確認 | $R_YOUTUBE |"; echo "| 画像カメラの更新確認 | $R_STILLS |"
            echo "| データ検証・ロールバック | $R_VALIDATE |"; echo "| リポジトリへの保存 | $R_SAVE |"; echo "| GitHub Pages への公開 | $R_DEPLOY |"
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "$R_YOUTUBE" "$R_STILLS" "$R_VALIDATE" "$R_SAVE" "$R_DEPLOY"; do
            if [ "$r" = "failure" ]; then echo "::error::失敗した手順があります（上の表を確認してください）"; exit 1; fi
          done
          if [ "$R_DEPLOY" != "success" ]; then echo "::error::サイトを公開できませんでした"; exit 1; fi
